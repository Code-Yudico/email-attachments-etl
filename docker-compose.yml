# Everything the pipeline needs to run locally: a mailbox to read from and a
# database to write to.
#   docker compose up -d
services:
  # Test mail server. Auth is disabled, so any user/password is accepted and
  # mailboxes are created on demand -- convenient for a demo, never for real use.
  mailserver:
    image: greenmail/standalone:2.1.4
    container_name: email-etl-mailserver
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "3025:3025"   # SMTP, used by scripts/seed_mailbox.py
      - "3143:3143"   # IMAP, used by the pipeline

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: email-etl-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Local_Dev_Pass123"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql_data:
